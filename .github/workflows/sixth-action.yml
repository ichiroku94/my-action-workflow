name: Ichiroku Sixth Action
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    # define the directory path explicitly
    defaults:
      run:
        working-directory: app3
    steps:
      - name: Ichiroku get code
        uses: actions/checkout@v3
      
      # installing dependency is taking quite longer
      # it would be nice if we cache the dependency and use it in the subsequence job(in this case build)
      # to cache dependcy perform in below step, we need to perform this step beforehand
      - name: ichiroku caching dependecy
        uses: actions/cache@v3
        with:
          # rather than action behavior, this path is npm behavior
          # npm store the cache inside here
          # it will look for this folder to get the tarball, if not exist, then it downloads from repo
          path: ~/.npm
          # we need to specify the key for our cache, which later can be used in next step
          # the reason for performing hashing is to provide unique key
          # when the dep is updated, a new key should be used as the old one will no longer valid
          # the cache action won't overwrite it if it found the cache key, so the updated dep won't be overwrite causing unupdated dependency issue
          key: deps-node-modules-${{hashFiles('**/package-lock.json')}} 
      - name: Ichiroku install dependencies
        run: npm ci
      - name: Ichiroku lint code
        run: npm run lint
      - name: Ichiroku test code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app3
    outputs:
      script-file: ${{steps.ichiroku_publish_id.outputs.ichiroku_var}}
    steps:
      - name: Ichiroku get code
        uses: actions/checkout@v3
        
      # we still need to call the action in the consumption as well, as the caching doesn't instruct the next job to use it, but rather make it available globally
      - name: ichiroku caching dependecy
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{hashFiles('**/package-lock.json')}} 
      
      - name: Ichiroku install dependencies
        run: npm ci
      - name: Ichiroku build website
        run: npm run build
        
      # let say, we want to get the name of js file builded and pass it to next job(in this case deploy)
      - name: Ichiroku publish JS file name
        # this id will be used in above outputs block
        id: ichiroku_publish_id
        # below command will get the js file generated within dist/assests folder
        # as the generated JS file name is random, we are using wildcard
        # this step will generate outputs with variable ichiroku_var, where allowing outputs block above to access it
        run: find dist/assets/*.js -type f -execdir echo 'ichiroku_var={}' >> $GITHUB_OUTPUT ';'
      
      - name: Ichiroku show list of files/folders
        run: ls -a
      - name: Ichiroku upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          # it seem the default working directory set above does not affect the actions
          # thus, we need to specify from the parent path
          path: app3/dist
        
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # to download from previous upload folder, we don't need to change the default directory
    # it seem the artifact will be search by the name specified in previous step
    # defaults:
    #   run:
    #     working-directory: app3
    steps:
      - name: Ichiroku get artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: Ichiroku see artifact
        run: ls -a
        
      # let say, we want to access the outputs result of previous job
      - name: Ichiroku get build output file
        # here how we retrieve the output variable of previous job
        run: echo "${{ needs.build.outputs.script-file }}"
      
      - name: Ichiroku deploy
        run: echo "Deploying..."
